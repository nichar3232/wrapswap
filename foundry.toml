[profile.default]
src = 'contracts/src'
test = 'contracts/test'
script = 'contracts/script'
out = 'contracts/out'
cache_path = 'contracts/cache'
libs = ['lib']
solc_version = '0.8.26'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = 'read-write', path = './deployments' }]
remappings = ['v4-core/=lib/v4-core/', 'v4-periphery/=lib/v4-periphery/', 'forge-std/=lib/forge-std/src/', '@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/', 'solmate/=lib/v4-core/lib/solmate/']
[profile.default.fuzz]
runs = 1000
